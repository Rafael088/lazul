<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lazul · aura</title>
<style>
  /* Aura de Lazul: un aro blanco chico en una superficie que sigue la mano.
     Tres estados: fuera del panel (nada), dentro (aro) y agarrando (aro
     relleno). La superficie es transparente y no recibe clics. */
  :root { --x: 0px; --y: 0px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: transparent;
    pointer-events: none; user-select: none;
    font: 13px/1.4 system-ui, sans-serif;
  }

  #punta {
    position: fixed; left: 0; top: 0; width: 0; height: 0;
    transform: translate3d(var(--x), var(--y), 0);
    opacity: 0; transition: opacity .16s ease;
    pointer-events: none; will-change: transform, opacity;
  }
  body.visible #punta { opacity: 1; }

  /* Aro chico y blanco: marca el punto de la mano sin taparlo. La sombra
     oscura y fina lo deja ver también sobre fondos claros. 18 px de
     diámetro con borde de 2 px (cabe en la superficie de 48 px). */
  #aro {
    position: absolute; left: -9px; top: -9px; width: 18px; height: 18px;
    border-radius: 50%; border: 2px solid rgba(255, 255, 255, .92);
    background: rgba(255, 255, 255, 0);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .30);
    transition: transform .12s ease, background .12s ease;
    will-change: transform;
  }

  /* Pellizcando: el aro se encoge y se rellena, como un dedo apoyado. */
  body.agarrando #aro {
    transform: scale(.72);
    background: rgba(255, 255, 255, .92);
  }
  @media (prefers-reduced-motion: reduce) {
    #aro, #punta { transition: none; }
  }
</style>
</head>
<body>
  <div id="punta" aria-hidden="true">
    <div id="aro"></div>
  </div>
<script>
  // La app llama window.aura(estado, ox, oy) al cambiar, hasta 25 veces/s. La superficie es
  // chica (48 px) y la mueve el layer-shell para centrarla en la mano; ox y
  // oy son el punto de la mano dentro de ella (difieren del centro solo junto
  // a los bordes del monitor). Aquí solo se pinta: nada de clics ni foco.
  const raiz = document.documentElement;
  window.aura = function (e, ox, oy) {
    if (!e) return;
    const dentro = !!(e.activa && e.calibrado && e.dentro);
    document.body.classList.toggle("visible", dentro);
    document.body.classList.toggle("agarrando", dentro && !!e.agarrando);
    if (!dentro) return;
    raiz.style.setProperty("--x", Number(ox || 0) + "px");
    raiz.style.setProperty("--y", Number(oy || 0) + "px");
  };
</script>
</body>
</html>
