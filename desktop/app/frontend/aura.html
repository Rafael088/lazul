<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lazul · aura</title>
<style>
  /* Aura de Lazul: un halo sobre toda la pantalla que sigue la mano.
     Tres estados: fuera del panel (nada), dentro (halo suave) y agarrando
     (halo encendido). La superficie es transparente y no recibe clics. */
  :root { --noche: #101428; --lapis: #315fdc; --hielo: #e8ecff; --x: 0px; --y: 0px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: transparent;
    pointer-events: none; user-select: none;
    font: 13px/1.4 system-ui, sans-serif;
  }

  #punta {
    position: fixed; left: 0; top: 0; width: 0; height: 0;
    transform: translate3d(var(--x), var(--y), 0);
    opacity: 0; transition: opacity .16s ease;
    pointer-events: none; will-change: transform, opacity;
  }
  body.visible #punta { opacity: 1; }

  /* Halo suave: Lapis sobre Noche, difuminado hacia el fondo. */
  #halo {
    position: absolute; left: -72px; top: -72px; width: 144px; height: 144px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(49, 95, 220, .58) 0%,
      rgba(49, 95, 220, .30) 42%,
      rgba(16, 20, 40, .12) 62%,
      rgba(16, 20, 40, 0) 72%);
    transition: transform .18s ease, background .18s ease;
    will-change: transform;
  }

  /* Anillo fino: marca el punto exacto de la mano. */
  #aro {
    position: absolute; left: -30px; top: -30px; width: 60px; height: 60px;
    border-radius: 50%; border: 2px solid rgba(127, 168, 255, .78);
    box-shadow: 0 0 12px rgba(49, 95, 220, .55), inset 0 0 8px rgba(49, 95, 220, .35);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    will-change: transform;
  }

  /* Agarrando: el halo se enciende y el anillo late. */
  body.agarrando #halo {
    transform: scale(1.35);
    background: radial-gradient(circle,
      rgba(232, 236, 255, .80) 0%,
      rgba(49, 95, 220, .62) 34%,
      rgba(49, 95, 220, .22) 56%,
      rgba(16, 20, 40, 0) 74%);
  }
  body.agarrando #aro {
    transform: scale(1.45);
    border-color: rgba(232, 236, 255, .96);
    box-shadow: 0 0 22px rgba(49, 95, 220, .95), 0 0 7px rgba(232, 236, 255, .9);
    animation: latido 1.1s ease-out infinite;
  }
  @keyframes latido {
    0%   { box-shadow: 0 0 0 0 rgba(232, 236, 255, .55), 0 0 22px rgba(49, 95, 220, .95); }
    100% { box-shadow: 0 0 0 26px rgba(232, 236, 255, 0), 0 0 22px rgba(49, 95, 220, .95); }
  }
  @media (prefers-reduced-motion: reduce) {
    #halo, #aro, #punta { transition: none; }
    body.agarrando #aro { animation: none; }
  }
</style>
</head>
<body>
  <div id="punta" aria-hidden="true">
    <div id="halo"></div>
    <div id="aro"></div>
  </div>
<script>
  // La app llama window.aura(estado) en cada cuadro con la posición de la
  // mano en 0..1 dentro del panel calibrado. Aquí solo se pinta: nada de
  // clics, foco ni teclado (la superficie ya llega con la entrada vacía).
  const raiz = document.documentElement;
  let tx = 0, ty = 0, x = 0, y = 0, visible = false, animando = false;

  function paso() {
    if (!visible) { animando = false; return; }
    x += (tx - x) * 0.35;
    y += (ty - y) * 0.35;
    raiz.style.setProperty("--x", x.toFixed(1) + "px");
    raiz.style.setProperty("--y", y.toFixed(1) + "px");
    requestAnimationFrame(paso);
  }

  window.aura = function (e) {
    if (!e) return;
    const dentro = !!(e.activa && e.calibrado && e.dentro);
    const estaba = visible;
    visible = dentro;
    document.body.classList.toggle("visible", dentro);
    document.body.classList.toggle("agarrando", dentro && !!e.agarrando);
    if (!dentro) return;
    tx = Number(e.x || 0) * window.innerWidth;
    ty = Number(e.y || 0) * window.innerHeight;
    // Primera aparición: se coloca sin arrastrar el halo desde el origen.
    if (!estaba) { x = tx; y = ty; }
    if (!animando) { animando = true; requestAnimationFrame(paso); }
  };
</script>
</body>
</html>
